name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - name: Install fixture dependencies
        run: python -m pip install --index-url https://pypi.org/simple ruff==0.15.7 numpy==1.26.4 opencv-python-headless==4.10.0.84 Pillow==11.1.0 requests==2.32.5 onnxruntime==1.21.0 PySide6==6.11.2 pygrabber==0.2 comtypes==1.4.13
      - name: Lint
        run: python -m ruff check
      - name: Compile source
        run: python -m compileall -q modules scripts run_studio.py runtime_bootstrap.py isolated_runtime.py
      - name: Unit fixtures
        run: python -s scripts/run_tests.py
